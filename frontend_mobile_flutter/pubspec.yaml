name: frontend_mobile_flutter
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.1.5+1
  flutter_native_splash: 2.3.11
  flutter_screenutil: ^5.9.3

  dio: ^5.11.1

  #dotenv
  flutter_dotenv: ^5.1.0

  # Navigation
  go_router: ^12.1.3

  # Persistent Storage
  shared_preferences: ^2.2.2

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Dependency Injection
  get_it: ^7.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - .env
